# Выкладка сервера «Кстати» в Yandex Cloud без Docker на Mac.
# При каждом push в main, если менялась папка server/, GitHub сам:
#   1) собирает образ из server/Dockerfile,
#   2) загружает его в Yandex Container Registry,
#   3) выкатывает новую ревизию Serverless Container,
#   4) проверяет /health.
# Можно запустить и вручную: GitHub → Actions → «Выкладка сервера» → Run workflow.
#
# Настройки (GitHub → Settings → Secrets and variables → Actions):
#   Secrets:   YC_SA_JSON_KEY — ключ сервисного аккаунта kstati-deployer (JSON целиком); ADMIN_EMAILS, FEEDBACK_EMAIL — почты (секреты, чтобы не светились в журнале)
#   Variables: FOLDER_ID, REGISTRY_ID, SA_ID, LOCKBOX_ID, CONTAINER_NAME, PUBLIC_URL,
#              YDB_DOCAPI_ENDPOINT, YANDEX_MODEL, APP_SCHEME, VK_CLIENT_ID, MAIL_FROM, VOICE_DAILY_LIMIT, PAID_DAILY_LIMIT
# Секреты самого сервера (JWT, ключи Яндекса, POISKKINO_API_KEY) лежат в Lockbox — в GitHub их нет.
name: Выкладка сервера

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    env:
      IMAGE: cr.yandex/${{ vars.REGISTRY_ID }}/kstati-server:${{ github.sha }}
    steps:
      # Действия закреплены по хешу коммита: подменённый тег не попадёт в сборку
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ключ — через переменную окружения, а не подстановкой в текст команды: так он не попадёт в скрипт и журнал
      - name: Вход в Container Registry
        env:
          YC_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: printf '%s' "$YC_KEY" | docker login --username json_key --password-stdin cr.yandex

      - name: Сборка и загрузка образа
        run: |
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Установка yc
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"

      - name: Вход в Yandex Cloud
        env:
          YC_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: |
          printf '%s' "$YC_KEY" > "$RUNNER_TEMP/key.json"
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          # Новые версии yc без yc init не знают адрес API — задаём явно
          yc config set endpoint api.cloud.yandex.net:443
          yc config set folder-id "${{ vars.FOLDER_ID }}"
          rm "$RUNNER_TEMP/key.json"

      - name: Новая ревизия контейнера
        # Почты — из секретов: в журнале выкладки (он открыт всем) они видны как ***. Пока секретов нет — из переменных
        env:
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL || vars.FEEDBACK_EMAIL }}
        run: |
          yc serverless container revision deploy \
            --container-name "${{ vars.CONTAINER_NAME }}" \
            --image "$IMAGE" \
            --service-account-id "${{ vars.SA_ID }}" \
            --memory 512MB \
            --cores 1 \
            --core-fraction 100 \
            --concurrency 8 \
            --execution-timeout 60s \
            --environment "NODE_ENV=production,LOG_DIR=stdout,YANDEX_FOLDER_ID=${{ vars.FOLDER_ID }},YANDEX_MODEL=${{ vars.YANDEX_MODEL }},PUBLIC_URL=${{ vars.PUBLIC_URL }},APP_SCHEME=${{ vars.APP_SCHEME }},YDB_DOCAPI_ENDPOINT=${{ vars.YDB_DOCAPI_ENDPOINT }},VK_CLIENT_ID=${{ vars.VK_CLIENT_ID }},MAIL_FROM=${{ vars.MAIL_FROM }},FEEDBACK_EMAIL=$FEEDBACK_EMAIL,VOICE_DAILY_LIMIT=${{ vars.VOICE_DAILY_LIMIT }},PAID_DAILY_LIMIT=${{ vars.PAID_DAILY_LIMIT }},ADMIN_EMAILS=$ADMIN_EMAILS" \
            --secret "environment-variable=JWT_SECRET,id=${{ vars.LOCKBOX_ID }},key=JWT_SECRET" \
            --secret "environment-variable=YANDEX_API_KEY,id=${{ vars.LOCKBOX_ID }},key=YANDEX_API_KEY" \
            --secret "environment-variable=AWS_ACCESS_KEY_ID,id=${{ vars.LOCKBOX_ID }},key=AWS_ACCESS_KEY_ID" \
            --secret "environment-variable=AWS_SECRET_ACCESS_KEY,id=${{ vars.LOCKBOX_ID }},key=AWS_SECRET_ACCESS_KEY" \
            --secret "environment-variable=POISKKINO_API_KEY,id=${{ vars.LOCKBOX_ID }},key=POISKKINO_API_KEY"

      - name: Проверка /health
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS "${{ vars.PUBLIC_URL }}/health" && echo && echo "✓ Сервер отвечает" && exit 0
            sleep 5
          done
          echo "✗ /health не отвечает" && exit 1

      # Каждая выкладка добавляет образ, а хранение в Container Registry платное: оставляем 5 последних в каждом
      # репозитории (текущий — самый свежий). Нет прав на удаление — выкладка не падает, в журнале будет ошибка
      - name: Чистка старых образов
        continue-on-error: true
        run: |
          yc container image list --registry-id "${{ vars.REGISTRY_ID }}" --limit 1000 --format json \
            | jq -r 'group_by(.name) | map(sort_by(.created_at) | reverse | .[5:]) | flatten | .[].id' \
            | while read -r id; do
                yc container image delete "$id" && echo "удалён $id"
              done
