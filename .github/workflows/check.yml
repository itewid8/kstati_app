# Проверка кода при каждом push и pull request в main (и вручную: Actions → «Проверка кода» → Run workflow).
# Сервер и приложение проверяются параллельно: типы, ESLint (ошибки и небезопасные паттерны), тесты,
# уязвимые зависимости уровня critical. Красная проверка — повод посмотреть до выкладки.
name: Проверка кода

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Лишние файлы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Архивы, .env, выгрузки из базы и сборка не должны попадать в git (утечка ключа 22.10.2026 — через архив в «Claude outputs»)
      - name: Нет архивов, ключей и сборки
        run: |
          bad=$(git ls-files | grep -iE '\.(tgz|tar|gz|zip|7z|apk|aab|ipa|jks|keystore|p8|p12|pem)$|(^|/)\.env($|\.)|(^|/)deploy\.env$|(^|/)build/|inspect\.txt$|^_to_delete/|^Claude outputs/' | grep -v '\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "В репозитории лишние файлы:"; echo "$bad"; exit 1; fi

  server:
    name: Сервер
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Действия закреплены по хешу коммита: подменённый тег не попадёт в сборку
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Тесты
        run: bash ../server-test.sh
      - name: Уязвимые зависимости
        run: npm audit --omit=dev --audit-level=critical

  app:
    name: Приложение
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-prod/package-lock.json
      - name: Зависимости
        run: npm ci
      - name: Типы
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Тесты
        run: npm test
      - name: Уязвимые зависимости
        run: npm audit --omit=dev --audit-level=critical
