<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструмент — год</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 820px; height: 844px; display: flex; gap: 40px; font-family: 'Geist', sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 20px; background: {{t.bg}}; color: {{t.text}}; outline: 1.5px solid {{t.border}}">

<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 40px; display: flex; align-items: center; gap: 8px">
<button style="height: 40px; flex: 1; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-align: left; padding: 0 12px; display: flex; align-items: center; justify-content: space-between">МЫ С КАРИНОЙ<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2.5"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display: flex; flex-shrink: 0"><button aria-label="Список" style="width: 36px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="M5.5 6h13M5.5 12h13M5.5 18h13"></path></svg></button><button aria-label="Календарь" style="width: 36px; height: 40px; margin-left: -1.5px; border: 1.5px solid {{t.border}}; background: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="2"><path d="M4 5h16v15H4zM4 10h16M9 3v4M15 3v4"></path></svg></button></div>
<button aria-label="Добавить" style="width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg></button>
<button aria-label="Лента" style="width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
<button aria-label="Настройки" style="width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.s}}; color: {{t.sInk}}; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">С</button>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 116px; height: 28px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
<sc-for list="{{t.views}}" as="v" hint-placeholder-count="4">
<button style="border: 1.5px solid {{t.border}}; margin-left: {{v.ml}}; background: {{v.bg}}; color: {{v.color}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: {{v.weight}}; letter-spacing: 0.08em">{{v.label}}</button>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 68px; height: 40px; display: flex; align-items: center; gap: 6px">
<span style="font-size: 34px; font-weight: 700; letter-spacing: -0.05em; line-height: 36px">2026</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{t.muted}}; margin-left: 4px; line-height: 13px">214<br>ДЕЛ</span>
<button aria-label="Предыдущий год" style="margin-left: auto; width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></button>
<button aria-label="Следующий год" style="width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 152px; display: flex; gap: 14px; font-family: 'Geist Mono', monospace; font-size: 9.5px; letter-spacing: 0.06em; color: {{t.muted}}">
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 9px; height: 9px; background: {{t.s}}"></span>САНЯ</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 9px; height: 9px; background: {{t.k}}"></span>КАРИНА</span>
<span style="display: flex; align-items: center; gap: 5px"><span style="width: 9px; height: 9px; background: linear-gradient(135deg, {{t.s}} 50%, {{t.k}} 50%)"></span>ВМЕСТЕ</span>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 174px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, 138px); gap: 6px">
<sc-for list="{{t.months}}" as="m" hint-placeholder-count="12">
<button aria-label="{{m.name}}" style="border: {{m.border}}; background: {{t.panel}}; padding: 8px 8px 0; font-family: inherit; color: {{t.text}}; display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left">
<span style="display: flex; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em"><span>{{m.name}}</span><span style="color: {{t.muted}}; font-weight: 400">{{m.count}}</span></span>
<span style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
<sc-for list="{{m.days}}" as="d" hint-placeholder-count="35"><span style="height: 12px; background: {{d.bg}}; box-shadow: {{d.ring}}"></span></sc-for>
</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 72px; display: flex; gap: 8px">
<div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<button style="border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em">ДЕЛА</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">ХОЧУ</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">СМОТРЕТЬ</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">ЗАМЕТКИ</button>
</div>
<button aria-label="Голосовая команда" style="width: 104px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{t.red}}; box-shadow: 0 0 10px {{t.glow}}"></span><span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: {{t.text}}">REC</span></button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', empty: '#E2E1DB', text: '#111111', muted: '#5E5E58', red: '#E0281E', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF' },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', empty: '#1E1E1E', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A' },
    ];
    const names = ['ЯНВ', 'ФЕВ', 'МАР', 'АПР', 'МАЙ', 'ИЮН', 'ИЮЛ', 'АВГ', 'СЕН', 'ОКТ', 'НОЯ', 'ДЕК'];
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const plan = [];
    for (let m = 0; m < 12; m++) {
      const first = (new Date(Date.UTC(2026, m, 1)).getUTCDay() + 6) % 7;
      const len = new Date(Date.UTC(2026, m + 1, 0)).getUTCDate();
      const days = [];
      for (let i = 0; i < 42; i++) {
        const d = i - first + 1;
        const r = rnd();
        const future = m > 9 || (m === 9 && d > 11);
        const busy = d >= 1 && d <= len ? (future ? r > 0.82 : r > 0.45) : false;
        const who = r > 0.85 ? 'sk' : r > 0.66 ? 'k' : 's';
        days.push({ d, inMonth: d >= 1 && d <= len, busy, who, level: 0.35 + (r % 0.13) * 5, today: m === 9 && d === 5 });
      }
      plan.push({ name: names[m], days: days.slice(0, first + len <= 35 ? 35 : 42), count: days.filter((x) => x.busy).length, current: m === 9 });
    }
    const views = ['ДЕНЬ', 'НЕДЕЛЯ', 'МЕСЯЦ', 'ГОД'];
    const themes = pal.map((p) => ({
      ...p,
      glow: rgba(p.red, 0.6),
      views: views.map((v, i) => ({ label: v, bg: i === 3 ? p.text : p.panel, color: i === 3 ? p.bg : p.text, weight: i === 3 ? 600 : 400, ml: i ? '-1.5px' : '0' })),
      months: plan.map((m) => ({
        name: m.name, count: m.count ? String(m.count) : '',
        border: m.current ? '1.5px solid ' + p.text : '1px solid ' + p.hair,
        days: m.days.map((d) => ({
          bg: !d.inMonth ? 'transparent' : d.today ? p.red : !d.busy ? p.empty
            : d.who === 'sk' ? 'linear-gradient(135deg, ' + rgba(p.s, d.level) + ' 50%, ' + rgba(p.k, d.level) + ' 50%)'
            : rgba(d.who === 's' ? p.s : p.k, d.level),
          ring: d.today ? '0 0 6px ' + rgba(p.red, 0.6) : 'none',
        })),
      })),
    }));
    return { themes };
  }
}
</script>
</body>
</html>
