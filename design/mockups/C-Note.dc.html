<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 40px; display: flex; align-items: center; gap: 8px"><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></button><span style="flex: 1; min-width: 0; font-family: 'Geist Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; color: {{t.muted}}; white-space: nowrap; overflow: hidden">ЗАМЕТКА · ПОЕЗДКИ</span><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.text}}" stroke="none"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div><div style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column"><div style="padding: 3px 0"><span style="display: block; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.04em">Алтай</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Чуйский тракт — 10 дней на машине, в конце июля.</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 600; color: {{t.text}}; text-decoration: none">Взять с собой</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="3.5"><path d="M5 12l5 5L20 7"></path></svg></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.muted}}; text-decoration: line-through">Палатка</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="3.5"><path d="M5 12l5 5L20 7"></path></svg></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.muted}}; text-decoration: line-through">Спальники</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: transparent; display: flex; align-items: center; justify-content: center"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Термос и горелка</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: transparent; display: flex; align-items: center; justify-content: center"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Аптечка</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; flex-shrink: 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; line-height: 22px">1.</span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Бийск — ночёвка</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; flex-shrink: 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; line-height: 22px">2.</span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Чемал</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; flex-shrink: 0; text-align: right; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; line-height: 22px">3.</span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Акташ, Гейзеровое озеро</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 5px; height: 5px; background: {{t.text}}"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Узнать про пропуск в погранзону</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 5px; height: 5px; background: {{t.text}}"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Заправки после Акташа</span></div></div><div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: {{t.bg}}; border-top: 1px solid {{t.hair}}"></div><div style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; display: flex; gap: 6px"><button aria-label="Чек-лист" style="width: 44px; height: 44px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="2"><path d="M4 4h16v16H4zM8 12l3 3 5-6"></path></svg></button><button aria-label="Нумерованный список" style="width: 44px; height: 44px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><span style="font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: -0.02em">1.</span></button><button aria-label="Список" style="width: 44px; height: 44px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2.4"><path d="M10 6h11M10 12h11M10 18h11M4 6h2M4 12h2M4 18h2"></path></svg></button><button aria-label="Заголовок" style="width: 44px; height: 44px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><span style="font-size: 17px; font-weight: 700; line-height: 20px">H</span></button><button aria-label="Жирный" style="width: 44px; height: 44px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center"><span style="font-size: 17px; font-weight: 700; line-height: 20px">B</span></button><button style="flex: 1; border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em">ГОТОВО</button></div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', hairStrong: '#A3A29C', faint: '#A3A29C', text: '#111111', muted: '#5E5E58', red: '#E0281E', warn: '#A15C00', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', hairStrong: '#3A3A3A', faint: '#4A4A47', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', warn: '#E5A50A', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', a: 0.24 },
    ];
    // Октябрь 2026: 1-е — четверг. sel — выбранные дни, from/to — диапазон (для многодневного дела)
    const calendar = (p, o) => Array.from({ length: 35 }, (_, i) => {
      const d = i - 2, inM = d >= 1 && d <= 31;
      const end = inM && (d === o.sel || d === o.from || d === o.to);
      const mid = inM && o.from && d > o.from && d < o.to;
      return {
        n: inM ? d : d < 1 ? 30 + d : d - 31,
        bg: end ? p.text : mid ? rgba(o.tint === 's' ? p.s : p.k, p.a) : 'transparent',
        color: end ? p.bg : !inM ? p.faint : d === 5 ? p.red : p.text,
        weight: end || d === 5 ? 600 : 400,
      };
    });
    const seg = (p, labels, on) => labels.map((label, i) => ({ label, ml: i ? '-1.5px' : '0', bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, weight: i === on ? 600 : 400 }));
    // Цвет человека всегда один: квадрат его цвета. В строке «Кто» показаны только выбранные
    const person = (p, name, c, on) => ({ name, c, show: on ? 'flex' : 'none' });
    const wheel = (p, rows) => rows.map(([h, m], i) => ({ h, m, size: i === 1 ? 17 : 12, weight: i === 1 ? 600 : 400, color: i === 1 ? p.text : p.muted }));
    const themes = pal.map((p) => ({ ...p, glow: rgba(p.red, 0.6) }));
    return { themes };
  }
}
</script>
