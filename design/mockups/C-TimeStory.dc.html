<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструмент — раскадровка: выбор времени</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 820px; height: 844px; display: flex; gap: 40px; font-family: 'Geist', sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 20px; background: {{t.bg}}; color: {{t.text}}; outline: 1.5px solid {{t.border}}">
<div style="position: absolute; left: 16px; right: 16px; top: 20px">
<div style="font-family: 'Geist Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; color: {{t.muted}}">РАСКАДРОВКА · ВЫБОР ВРЕМЕНИ</div>
<div style="margin-top: 4px; font-size: 24px; font-weight: 700; letter-spacing: -0.04em; line-height: 28px">Колесо времени</div>
</div>
<div style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{t.frames}}" as="f" hint-placeholder-count="6">
<div style="height: 120px; display: flex; gap: 10px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; padding: 8px; box-sizing: border-box">
<div style="width: 196px; flex-shrink: 0; display: flex; flex-direction: column; gap: 5px">
<sc-if value="{{f.cells}}" hint-placeholder-val="{{false}}"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))"><sc-for list="{{f.cellList}}" as="c" hint-placeholder-count="2"><span style="height: 24px; margin-left: {{c.ml}}; white-space: nowrap; overflow: hidden; border: 1.5px solid {{t.border}}; background: {{c.bg}}; color: {{c.color}}; padding: 0 5px; display: flex; flex-direction: column; justify-content: center; font-family: 'Geist Mono', monospace;"><span style="font-size: 6.5px; letter-spacing: 0.06em; opacity: 0.7">{{c.label}}</span><span style="font-size: 7.5px; font-weight: 600">{{c.value}}</span></span></sc-for></div></sc-if>
<div style="position: relative; flex-shrink: 0; height: {{f.wheelH}}px; border: 1.5px solid {{t.border}}; background: {{t.bg}}; overflow: hidden">
<span style="position: absolute; left: 0; right: 0; top: {{f.bandTop}}px; height: 26px; border-top: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}"></span>
<span style="position: absolute; left: 50%; top: {{f.bandTop}}px; width: 12px; margin-left: -6px; height: 26px; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 15px; font-weight: 600">:</span>
<span style="position: absolute; left: 50%; right: 0; top: 0; bottom: 0; margin-left: 6px; background: {{f.minBg}}; border-left: {{f.minLine}}"></span>
<sc-for list="{{f.nums}}" as="n" hint-placeholder-count="8"><span style="position: absolute; {{n.side}}; top: {{n.y}}px; width: 50%; height: 20px; margin-top: -10px; display: flex; align-items: center; justify-content: {{n.just}}; padding: 0 10px; box-sizing: border-box; font-family: 'Geist Mono', monospace; font-size: {{n.size}}px; font-weight: {{n.weight}}; color: {{n.color}}; opacity: {{n.op}}; filter: {{n.blur}}">{{n.t}}</span></sc-for>
<sc-if value="{{f.finger}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 70%; top: {{f.fingerY}}px; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 13px; border: 2px solid {{t.red}}; background: {{f.fingerFill}}"></span></sc-if>
</div>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.06em">{{f.head}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 8.5px; letter-spacing: 0.04em; color: {{f.metaColor}}">{{f.meta}}</span>
<span style="font-size: 11.5px; line-height: 14px; color: {{t.text}}">{{f.text}}</span>
</div>
</div>
</sc-for>
</div>

</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', hairStrong: '#A3A29C', faint: '#A3A29C', text: '#111111', muted: '#5E5E58', red: '#E0281E', warn: '#A15C00', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', hairStrong: '#3A3A3A', faint: '#4A4A47', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', warn: '#E5A50A', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', a: 0.24 },
    ];
    // Октябрь 2026: 1-е — четверг. sel — выбранные дни, from/to — диапазон (для многодневного дела)
    const calendar = (p, o) => Array.from({ length: 35 }, (_, i) => {
      const d = i - 2, inM = d >= 1 && d <= 31;
      const end = inM && (d === o.sel || d === o.from || d === o.to);
      const mid = inM && o.from && d > o.from && d < o.to;
      return {
        n: inM ? d : d < 1 ? 30 + d : d - 31,
        bg: end ? p.text : mid ? rgba(o.tint === 's' ? p.s : p.k, p.a) : 'transparent',
        color: end ? p.bg : !inM ? p.faint : d === 5 ? p.red : p.text,
        weight: end || d === 5 ? 600 : 400,
      };
    });
    const seg = (p, labels, on) => labels.map((label, i) => ({ label, ml: i ? '-1.5px' : '0', bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, weight: i === on ? 600 : 400 }));
    // Цвет человека всегда один: квадрат его цвета. В строке «Кто» показаны только выбранные
    const person = (p, name, c, on) => ({ name, c, show: on ? 'flex' : 'none' });
    const wheel = (p, rows) => rows.map(([h, m], i) => ({ h, m, size: i === 1 ? 17 : 12, weight: i === 1 ? 600 : 400, color: i === 1 ? p.text : p.muted }));
    // Колесо: шаг строки 24 px, рамка выбора — середина окна. Номера строк считаются от центра.
    const PITCH = 24, H = 74, MID = H / 2;
    const col = (p, side, values, centerIdx, offset, opt = {}) => values.map((t, i) => {
      const y = MID + (i - centerIdx) * PITCH + offset;
      const d = Math.min(1, Math.abs(y - MID) / PITCH);
      return {
        t, y, side: side === 'h' ? 'left: 0' : 'left: 50%', just: side === 'h' ? 'flex-end' : 'flex-start',
        size: Math.round((17 - 5 * d) * 10) / 10, weight: d < 0.5 ? 600 : 400,
        color: d < 0.5 ? p.text : p.muted, op: y < -10 || y > H + 10 ? 0 : 1, blur: opt.blur && side === 'm' ? 'blur(0.7px)' : 'none',
      };
    });
    const hours = (p) => col(p, 'h', ['05', '06', '07', '08', '09'], 2, 0);
    const mins = ['50', '55', '00', '05', '10', '15', '20', '25', '30'];
    const themes = pal.map((p) => {
      const frame = (head, meta, text, minOffset, extra = {}) => ({
        head, meta, text, metaColor: extra.metaColor || p.muted,
        nums: hours(p).concat(col(p, 'm', mins, 2, minOffset, extra)),
        wheelH: H, bandTop: MID - 13,
        minBg: extra.touch ? rgba(p.text === '#111111' ? '#111111' : '#F2F2F0', 0.06) : 'transparent',
        minLine: extra.touch ? '1px solid ' + p.hair : '0',
        finger: !!extra.finger, fingerY: extra.fingerY || MID, fingerFill: rgba(p.red, 0.15),
        cells: !!extra.cells, cellList: extra.cells || [],
      });
      const cells = (start, end, flash) => [['НАЧАЛО', start, true], ['КОНЕЦ', end, false]].map(([label, value, sel], i) => ({
        label, value, ml: i ? '-1.5px' : '0',
        bg: sel ? p.text : flash ? rgba(p.k, p.a + 0.15) : p.panel, color: sel ? p.bg : p.text,
      }));
      const C0 = cells('СР 7 ОКТ · 07:00', 'ПТ 9 ОКТ · 15:00');
      return {
        ...p,
        frames: [
          frame('01 · ПОКОЙ', '0 МС', 'Выбрано 07:00. Центральная строка в рамке, соседние мельче и бледнее.', 0, { cells: C0 }),
          frame('02 · КАСАНИЕ', '0 МС · ЛЁГКИЙ ОТКЛИК', 'Палец на минутах: колонка подсвечивается, телефон даёт короткий отклик.', 0, { touch: true, finger: true, cells: C0, metaColor: p.red }),
          frame('03 · ВЕДЁМ ПАЛЬЦЕМ', 'ЗА ПАЛЬЦЕМ 1:1', 'Цифры идут вместе с пальцем. Размер меняется плавно: у рамки крупнее, к краям мельче.', -12, { touch: true, finger: true, fingerY: MID - 12 }),
          frame('04 · ИНЕРЦИЯ', '≈300 МС · ЗАТУХАНИЕ', 'Палец отпущен — колесо докручивается по инерции. На каждом шаге в 5 минут — тихий щелчок отклика.', -52, { blur: true }),
          frame('05 · ДОВОДКА', 'ПРУЖИНА ≈180 МС · ПЕРЕЛЁТ 4 PX', 'Колесо встаёт на ближайшее значение: чуть проскакивает и возвращается.', -76, {}),
          frame('06 · ИТОГ', 'ЗНАЧЕНИЕ ПРИМЕНЕНО', 'В «Начале» 07:15. Конец сдвигается на те же 15 минут и коротко подсвечивается.', -72, { cells: cells('СР 7 ОКТ · 07:15', 'ПТ 9 ОКТ · 15:15', true) }),
        ],
      };
    });
    return { themes };
  }
}
</script>
</body>
</html>
