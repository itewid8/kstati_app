<script>
// Текст дела — только целыми строками (как fitTextLines в приложении): строка, которой не хватает высоты
// (до низа блока или до верха гостя, data-room), не рисуется, и всё ниже неё тоже
Promise.all([...document.fonts].map((f) => f.load().catch(() => null))).then(() => document.fonts.ready).then(() => {
  document.querySelectorAll('[data-room]').forEach((box) => {
    const room = Number(box.dataset.room);
    let y = 0, any = false, stop = false;
    [...box.children].forEach((span) => {
      const lh = parseFloat(getComputedStyle(span).lineHeight);
      const n = Math.max(1, Math.round(span.getBoundingClientRect().height / lh));
      const gap = any ? 1 : 0;
      const fit = stop ? 0 : Math.min(n, Math.floor((room - y - gap + 0.01) / lh));
      if (fit <= 0) { stop = true; span.style.display = 'none'; return; }
      y += gap + fit * lh;
      any = true;
      if (fit < n) stop = true;
    });
    box.style.height = parseFloat(box.style.paddingTop) + y + 'px';
  });
});
</script>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', alt: '#DEDDD7', border: '#161616', hair: '#CFCEC8', text: '#111111', muted: '#5E5E58', red: '#E0281E', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', o: '#1F9D57', oInk: '#FFFFFF', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', alt: '#121212', border: '#2E2E2E', hair: '#1E1E1E', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', o: '#3DBE76', oInk: '#1A1A1A', a: 0.24 },
    ];
    const GX = 44, GW = 390 - 44 - 26, COL = GW / 7;
    // Дела на весь день и на несколько дней — полосы над сеткой: [первый день, последний день, название, подпись, кто].
    // Раскладываются по строкам жадно: полоса встаёт в первую строку, где она ни с кем не пересекается по дням
    const allDay = [
      [0, 0, 'Подарок Лене', '', 's'],
      [2, 4, 'Командировка в Казань', ' · 7 окт 07:00 → 9 окт 15:00', 'k'],
      [3, 5, 'Мама в гостях', ' · 8–10 окт', 'sk'],
      [5, 5, 'Дача', ' 09–20', 'sk'],
    ];
    const BY = 208, BH = 22, rowEnds = [];
    const barRows = allDay
      .map(([d0, d1, title, meta, who]) => ({ d0, d1, title, meta, who }))
      .sort((x, y) => x.d0 - y.d0 || y.d1 - x.d1)
      .map((b) => {
        let row = rowEnds.findIndex((end) => end < b.d0);
        if (row < 0) { row = rowEnds.length; rowEnds.push(-1); }
        rowEnds[row] = b.d1;
        return { ...b, row };
      });
    const nRows = rowEnds.length;
    // Сетка часов начинается сразу под полосами и тянется до нижних кнопок
    const GY = BY + nRows * BH + 8, GH = 746 - GY;
    // [день, начало, конец, название, кто, { done, parent }]
    const ev = [
      [0, 9.5, 10.5, 'Стоматолог', 's'], [0, 19, 20, 'Йога', 'k'],
      [1, 16, 17, 'МФЦ', 's'], [1, 19, 20.5, 'Ужин с Леной', 'sk'],
      // Командировка — общее дело (полоса наверху), в сетке только её подзадачи с подписью «· Казань»
      [2, 7, 9, 'Поезд в Казань', 'k', { parent: 'Казань' }], [2, 18, 21, 'Футбол', 's', { done: true }],
      // Три человека одновременно: каждое следующее дело огибает полосы всех предыдущих
      [3, 9, 15, 'Встреча с заказчиком', 'k', { parent: 'Казань' }], [3, 10.25, 13.75, 'Тренировка', 's'], [3, 11.25, 12.75, 'Сдать отчёт', 'o'],
      [4, 13, 15, 'Поезд домой', 'k', { parent: 'Казань' }], [4, 14, 16.5, 'Обед с Олегом', 's'], [4, 19.5, 22, 'Кино', 'sk'],
      // Общее дело с подзадачами в сетке не рисуется: оно уходит полосой наверх (см. bars), а подзадачи —
      // обычные дела в сетке и пересекаются с чужими делами по общему правилу. Подпись подзадачи — «кто · общее дело»
      [5, 9, 10.5, 'Полить грядки', 's', { parent: 'Дача' }], [5, 13, 15.5, 'Шашлыки', 'k', { parent: 'Дача' }],
      [5, 14, 15, 'Созвон', 'o'], [5, 17, 18.5, 'Звонок маме', 's'],
      [6, 11, 13, 'Бранч у Ани', 'sk'],
    ];
    // Видимые часы подстраиваются под дела: на час раньше самого раннего начала и на час позже самого позднего конца
    // (и с учётом текущего времени), чтобы дела не упирались в край сетки
    const NOW = 17 + 52 / 60;
    const H0 = Math.max(0, Math.min(...ev.map((e) => Math.floor(e[1])), Math.floor(NOW)) - 1);
    const HN = Math.min(24, Math.max(...ev.map((e) => Math.ceil(e[2])), Math.ceil(NOW)) + 1) - H0, H = GH / HN;
    // Общее правило пересечений. Из двух пересекающихся дел «основа» — то, что началось раньше (оно уже идёт,
    // его заголовок наверху виден целиком); при одновременном начале — более длинное. Второе — «гость».
    // Основа сужается до своей полосы (WN) уступом: прямая горизонтальная ступенька со скруглёнными углами (RAD),
    // которая стоит до начала гостя (верх гостя прямой); после гостя таким же уступом расширяется обратно.
    // Гость занимает всё, что справа от основы, с зазором G (по горизонтали и по вертикали). Если основа кончается
    // во время гостя, гость тоже уступом возвращает себе всю ширину. Цветная полоса гостя идёт по его левому краю и повторяет уступы.
    const Wr = COL - 2, WN = 2, G = 2, RAD = 4, Gh = G / H, T = 0.01 / H, rampH = 0.01 / H;
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    const items = ev.map(([d, a, b, title, who, o = {}], i) => ({ i, d, a, b, title, who, o, top: Math.max(a, H0), bot: Math.min(b, H0 + HN) }));
    const dur = (e) => e.b - e.a;
    const longer = (x, y) => x.a < y.a || (x.a === y.a && dur(x) > dur(y));
    items.forEach((e) => {
      const ov = items.filter((o) => o !== e && o.d === e.d && o.a < e.b && e.a < o.b);
      e.hosts = ov.filter((o) => longer(o, e));
      e.guests = ov.filter((o) => longer(e, o));
    });
    // Вклад соседа по времени с зазором: внутри его интервала — его край + G, за концами — короткий пологий скос в ноль
    const envelope = (n, t, edge, gh = Gh) => {
      if (t >= n.a - gh && t <= n.b + gh) return Math.max(edge(n, t - gh), edge(n, t), edge(n, t + gh)) + G;
      if (t > n.b + gh && t < n.b + gh + rampH) return (edge(n, n.b) + G) * (1 - (t - n.b - gh) / rampH);
      if (t < n.a - gh && t > n.a - gh - rampH) return (edge(n, n.a) + G) * (1 - (n.a - gh - t) / rampH);
      return 0;
    };
    const rightAt = (e, t) => {
      t = Math.max(e.a, Math.min(e.b, t));
      let k = 0;
      e.guests.forEach((g) => { k = Math.max(k, Math.min(clamp01((t - (g.a - Gh - T)) / T), clamp01((g.b + Gh + T - t) / T))); });
      // Сужается до своей полосы, где бы ни стоял её левый край (у гостя он сдвинут вправо)
      const base = leftAt(e, t) + WN;
      return base + (Wr - base) * (1 - k);
    };
    const leftAt = (e, t) => {
      let x = 0;
      e.hosts.forEach((h) => { x = Math.max(x, envelope(h, t, rightAt)); });
      return x;
    };
    const simplify = (pts) => pts.filter((p, j) => {
      if (j === 0 || j === pts.length - 1) return true;
      const q = pts[j - 1], s = pts[j + 1];
      return Math.abs((p[0] - q[0]) * (s[1] - q[1]) - (p[1] - q[1]) * (s[0] - q[0])) > 0.01;
    });
    const r = (n) => Math.round(n * 10) / 10;
    // Скачок ширины между соседними строками превращаем в горизонтальную ступеньку
    const stepify = (pts) => {
      const out = [];
      pts.forEach((p, j) => { if (j && Math.abs(p[0] - pts[j - 1][0]) > 0.5) out.push([pts[j - 1][0], p[1]]); out.push(p); });
      return out;
    };
    // Контур в SVG-путь: внутренние углы (не верх и не низ блока) скругляются радиусом RAD
    const rounded = (pts, closed, h) => {
      const n = pts.length;
      return pts.map((P, j) => {
        const cmd = j ? ' L ' : 'M ';
        const end = !closed && (j === 0 || j === n - 1);
        if (end || P[1] < 0.01 || P[1] > h - 0.01) return cmd + r(P[0]) + ' ' + r(P[1]);
        const A = pts[(j - 1 + n) % n], B = pts[(j + 1) % n];
        const la = Math.hypot(A[0] - P[0], A[1] - P[1]), lb = Math.hypot(B[0] - P[0], B[1] - P[1]);
        const rr = Math.min(RAD, la / 2, lb / 2);
        const p1 = [P[0] + ((A[0] - P[0]) / la) * rr, P[1] + ((A[1] - P[1]) / la) * rr];
        const p2 = [P[0] + ((B[0] - P[0]) / lb) * rr, P[1] + ((B[1] - P[1]) / lb) * rr];
        return cmd + r(p1[0]) + ' ' + r(p1[1]) + ' Q ' + r(P[0]) + ' ' + r(P[1]) + ' ' + r(p2[0]) + ' ' + r(p2[1]);
      }).join('') + (closed ? ' Z' : '');
    };
    const shapes = items.map((e) => {
      const y = GY + (e.top - H0) * H + 1, h = (e.bot - e.top) * H - 2;
      const tAt = (yl) => e.top + (yl + 1) / H;
      const ys = [];
      for (let yl = 0; yl < h; yl += 1) ys.push(yl);
      ys.push(h);
      const L = ys.map((yl) => [leftAt(e, tAt(yl)), yl]);
      const Ls = simplify(stepify(L)), Rs = simplify(stepify(ys.map((yl) => [rightAt(e, tAt(yl)), yl]))).reverse();
      const poly = Ls.concat(Rs);
      const d = rounded(poly, true, h);
      let j = 0;
      while (j < L.length - 1 && L[j + 1][0] < L[j][0] - 0.01) j++;
      const pt = (j ? L[j][1] : 0) + 3;
      // Место под текст: от pt вниз, пока блок шире своей полосы WN (ниже строку срезал бы верх гостя)
      let yb = pt;
      while (yb < h && rightAt(e, tAt(yb)) - leftAt(e, tAt(yb)) > WN + 0.01) yb += 0.25;
      return {
        x: GX + e.d * COL + 1, y, w: Wr, h,
        d, clip: "path('" + d + "')", edgeD: rounded(Ls, false, h),
        pt, pl: L[j][0] + 6, room: Math.min(yb, h) - pt,
      };
    });
    const fmt = (h) => String(Math.floor(h) % 24).padStart(2, '0') + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');
    const wd = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
    const views = ['ДЕНЬ', 'НЕДЕЛЯ', 'МЕСЯЦ', 'ГОД'];
    const themes = pal.map((p, pi) => {
      return {
        ...p,
        glow: rgba(p.red, 0.6), colW: COL,
        views: views.map((v, i) => ({ label: v, bg: i === 1 ? p.text : p.panel, color: i === 1 ? p.bg : p.text, weight: i === 1 ? 600 : 400, ml: i ? '-1.5px' : '0' })),
        cols: wd.map((w, i) => ({ wd: w, n: String(5 + i).padStart(2, '0'), x: GX + i * COL, w: COL, shade: i % 2 ? p.alt : 'transparent', fill: i === 0 ? p.red : 'transparent', color: i === 0 ? '#FFFFFF' : p.text })),
        bars: barRows.map((b) => ({
          x: GX + b.d0 * COL + 1, y: BY + b.row * BH, w: (b.d1 - b.d0 + 1) * COL - 2, title: b.title, meta: b.meta,
          tip: b.who === 'sk' ? 'linear-gradient(' + p.s + ' 50%, ' + p.k + ' 50%)' : b.who === 's' ? p.s : p.k,
          fill: b.who === 'sk' ? 'linear-gradient(90deg, ' + rgba(p.s, p.a) + ', ' + rgba(p.k, p.a) + ')' : rgba(b.who === 's' ? p.s : p.k, p.a),
        })),
        barsEnd: BY + nRows * BH + 4,
        hours: Array.from({ length: HN }, (_, i) => ({ y: GY + i * H, ly: GY + i * H + 2, label: String(H0 + i).padStart(2, '0') })),
        events: items.map((e, i) => {
          const { a, b, title, who, o } = e;
          const time = a === 0 && b > 23 ? 'весь день' : a === 0 ? '→ ' + fmt(b) : b > 23 ? fmt(a) + ' →' : fmt(a) + '–' + fmt(b);
          return {
            ...shapes[i],
            fid: 'wf' + pi + '_' + i, tid: 'wt' + pi + '_' + i, cid: 'wc' + pi + '_' + i,
            c1: who === 'o' ? p.o : who === 'k' ? p.k : p.s, c2: who === 'o' ? p.o : who === 's' ? p.s : p.k,
            title, time, who: (who === 'sk' ? 'Саня, Карина' : who === 's' ? 'Саня' : who === 'o' ? 'Олег' : 'Карина') + (o.parent ? ' · ' + o.parent : ''),
            deco: o.done ? 'line-through' : 'none',
          };
        }),
        nowY: GY + (NOW - H0) * H, nowDot: GY + (NOW - H0) * H - 3,
        tabs: [
          // Вкладки закреплены на одном месте в дне и неделе (как в C-Day): не зависят от числа полос
          { name: 'Я', y: 212, w: 26, bg: p.s, ink: p.sInk },
          { name: 'КАРИНА', y: 300, w: 26, bg: p.k, ink: p.kInk },
          { name: 'ОЛЕГ', y: 388, w: 26, bg: p.o, ink: p.oInk },
        ],
      };
    });
    return { themes };
  }
}
</script>
