<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 0; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">ПЕРИОД<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="2.5"><path d="m6 15 6-6 6 6"></path></svg></span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: {{t.text}}">СР 7 ОКТ → ПТ 9 ОКТ</span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"></span></div>
<div style="border-top: 1px solid {{t.hair}}; background: {{t.bg}}; padding: 10px 8px; display: flex; flex-direction: column; gap: 8px"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))"><sc-for list="{{t.ends}}" as="g" hint-placeholder-count="2"><button style="height: 40px; margin-left: {{g.ml}}; border: 1.5px solid {{t.border}}; background: {{g.bg}}; color: {{g.color}}; padding: 0 8px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; font-family: 'Geist Mono', monospace;"><span style="font-size: 8px; letter-spacing: 0.08em; opacity: 0.7">{{g.label}}</span><span style="font-size: 11px; font-weight: 600">{{g.value}}</span></button></sc-for></div><div style="display: flex; align-items: center; justify-content: space-between"><button aria-label="Выбрать месяц и год" style="height: 28px; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 6px; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.08em">ОКТЯБРЬ 2026<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="3"><path d="m6 9 6 6 6-6"></path></svg></button><span style="display: flex; gap: 4px"><button aria-label="Предыдущий месяц" style="width: 28px; height: 28px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2.2"><path d="m15 18-6-6 6-6"></path></svg></button><button aria-label="Следующий месяц" style="width: 28px; height: 28px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></button></span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); font-family: 'Geist Mono', monospace; font-size: 8.5px; letter-spacing: 0.06em; color: {{t.muted}}; text-align: center"><span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВС</span></div><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 26px; margin-top: -4px"><sc-for list="{{t.cal}}" as="c" hint-placeholder-count="35"><button style="border: 0; padding: 0; background: {{c.bg}}; color: {{c.color}}; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: {{c.weight}}">{{c.n}}</button></sc-for></div><div style="display: flex; align-items: center; gap: 8px"><div style="flex: 1; position: relative; border: 1.5px solid {{t.border}}; background: {{t.panel}}"><span style="position: absolute; left: 0; right: 0; top: 22px; height: 26px; border-top: 1px solid {{t.hair}}; border-bottom: 1px solid {{t.hair}}"></span><sc-for list="{{t.wheel}}" as="w" hint-placeholder-count="3"><div style="height: {{w.rowH}}px; display: grid; grid-template-columns: 1fr 12px 1fr; align-items: center; font-family: 'Geist Mono', monospace; font-size: {{w.size}}px; font-weight: {{w.weight}}; color: {{w.color}}"><span style="text-align: right">{{w.h}}</span><span style="text-align: center">{{w.colon}}</span><span>{{w.m}}</span></div></sc-for></div><button style="width: 104px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.06em">БЕЗ ВРЕМЕНИ</button></div></div>
<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid {{t.hair}}; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: transparent; color: {{t.muted}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">ПОВТОР</span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: {{t.muted}}">НЕ ПОВТОРЯЕТСЯ</span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></span></div>
<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid {{t.hair}}; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: transparent; color: {{t.muted}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">КТО</span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="display: flex; flex-wrap: wrap; gap: 4px 12px"><sc-for list="{{t.people}}" as="w" hint-placeholder-count="2"><span style="display: {{w.show}}; align-items: center; gap: 6px; font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.06em"><span style="width: 10px; height: 10px; background: {{w.c}}"></span>{{w.name}}</span></sc-for></span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></span></div>
<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid {{t.hair}}; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: transparent; color: {{t.muted}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">ВИДНО</span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: {{t.text}}">МЫ С КАРИНОЙ</span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></span></div>
<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid {{t.hair}}; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: transparent; color: {{t.muted}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">НАПОМНИТЬ</span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: {{t.text}}">НАКАНУНЕ В 20:00</span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></span></div>
<div style="display: flex; align-items: stretch; min-height: 44px; border-top: 1px solid {{t.hair}}; background: {{t.panel}}"><span style="width: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; box-sizing: border-box; background: transparent; color: {{t.muted}}; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em">ПОДЗАДАЧИ</span><span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 10px; box-sizing: border-box"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.02em; color: {{t.text}}">05 · 1 СДЕЛАНО</span></span><span style="width: 28px; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.2"><path d="m9 18 6-6-6-6"></path></svg></span></div>
</div>
<div style="position: relative; min-height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 11px; border: 1.5px solid {{t.warn}}; background: {{t.panel}}"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: {{t.warn}}"></span><span style="font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; color: {{t.warn}}">ВНЕ ПЕРИОДА</span><span style="font-size: 12px; color: {{t.text}}">«Сувениры маме» · сб 10 окт</span></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: {{t.bg}}; border-top: 1px solid {{t.hair}}"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; display: flex; gap: 8px">
<button style="flex: 1; border: 1.5px solid {{t.red}}; background: none; color: {{t.red}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em">УДАЛИТЬ</button>
<button style="flex: 1.6; border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em">СОХРАНИТЬ</button>
</div>

</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', hairStrong: '#A3A29C', faint: '#A3A29C', text: '#111111', muted: '#5E5E58', red: '#E0281E', warn: '#A15C00', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', hairStrong: '#3A3A3A', faint: '#4A4A47', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', warn: '#E5A50A', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', a: 0.24 },
    ];
    // Октябрь 2026: 1-е — четверг. sel — выбранные дни, from/to — диапазон (для многодневного дела)
    const calendar = (p, o) => Array.from({ length: 35 }, (_, i) => {
      const d = i - 2, inM = d >= 1 && d <= 31;
      const end = inM && (d === o.sel || d === o.from || d === o.to);
      const mid = inM && o.from && d > o.from && d < o.to;
      return {
        n: inM ? d : d < 1 ? 30 + d : d - 31,
        bg: end ? p.text : mid ? rgba(o.tint === 's' ? p.s : p.k, p.a) : 'transparent',
        color: end ? p.bg : !inM ? p.faint : d === 5 ? p.red : p.text,
        weight: end || d === 5 ? 600 : 400,
      };
    });
    const seg = (p, labels, on) => labels.map((label, i) => ({ label, ml: i ? '-1.5px' : '0', bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, weight: i === on ? 600 : 400 }));
    // Цвет человека всегда один: квадрат его цвета. В строке «Кто» показаны только выбранные
    const person = (p, name, c, on) => ({ name, c, show: on ? 'flex' : 'none' });
    const wheel = (p, rows) => rows.map(([h, m], i) => ({ h, m, size: i === 1 ? 17 : 12, weight: i === 1 ? 600 : 400, color: i === 1 ? p.text : p.muted }));
    const themes = pal.map((p) => ({
      ...p,
      ends: [['НАЧАЛО', 'СР 7 ОКТ · 07:00'], ['КОНЕЦ', 'ПТ 9 ОКТ · 15:00']].map(([label, value], i) => ({ label, value, ml: i ? '-1.5px' : '0', bg: i === 0 ? p.text : p.panel, color: i === 0 ? p.bg : p.text })),
      cal: calendar(p, { from: 7, to: 9, tint: 'k' }),
      wheel: wheel(p, [['06', '55'], ['07', '00'], ['08', '05']]).map((w, i) => ({ ...w, rowH: i === 1 ? 26 : 22, colon: ':' })),
      people: [person(p, 'САНЯ', p.s, false), person(p, 'КАРИНА', p.k, true)],
    }));
    return { themes };
  }
}
</script>
</body>
