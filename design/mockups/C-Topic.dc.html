<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструмент — тема заметок</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 820px; height: 844px; display: flex; gap: 40px; font-family: 'Geist', sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 20px; background: {{t.bg}}; color: {{t.text}}; outline: 1.5px solid {{t.border}}">
<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 40px; display: flex; align-items: center; gap: 8px"><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></button><span style="flex: 1; min-width: 0; font-family: 'Geist Mono', monospace; font-size: 9.5px; letter-spacing: 0.08em; color: {{t.muted}}; white-space: nowrap; overflow: hidden">ТЕМА</span><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></button><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="M12 5v14M5 12h14"></path></svg></button><button style="width: 40px; height: 40px; flex-shrink: 0; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.text}}" stroke="none"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg></button></div><div style="position: absolute; left: 16px; right: 16px; top: 70px; height: 42px; display: flex; align-items: flex-end; font-size: 40px; font-weight: 700; letter-spacing: -0.05em; line-height: 42px; white-space: nowrap; overflow: hidden">Поездки</div><div style="position: absolute; left: 16px; right: 16px; top: 122px; display: flex; flex-direction: column"><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Куда хотим этим летом:</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{t.bg}}" stroke-width="3.5"><path d="M5 12l5 5L20 7"></path></svg></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.muted}}; text-decoration: line-through">Алтай</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: transparent; display: flex; align-items: center; justify-content: center"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Карелия</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><span style="width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid {{t.border}}; background: transparent; display: flex; align-items: center; justify-content: center"></span></span><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Байкал</span></div><div style="display: flex; align-items: flex-start; gap: 8px; padding: 3px 0"><span style="flex: 1; min-width: 0; font-size: 15px; line-height: 22px; font-weight: 400; color: {{t.text}}; text-decoration: none">Бюджет — до 150 тыс. на двоих.</span></div><div style="height: 24px"></div><div style="border: 1.5px solid {{t.border}}"><div style="height: 22px; padding: 0 8px; background: {{t.text}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em"><span>ЗАМЕТКИ</span><span>{{t.count}}</span></div><sc-for list="{{t.notes}}" as="n" hint-placeholder-count="4"><div style="position: relative; border-top: 1px solid {{t.hair}}; background: {{t.panel}}; padding: 9px 10px 9px 12px; display: flex; flex-direction: column; gap: 3px"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: {{t.s}}"></span><span style="font-size: 13px; font-weight: 600; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.title}}</span><span style="display: {{n.lineShow}}; font-size: 12.5px; line-height: 16px; color: {{t.muted}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{n.line}}</span><span style="display: flex; align-items: center; justify-content: space-between; height: 11px"><span style="font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.02em; line-height: 11px; color: {{t.muted}}">{{n.date}}</span><span style="display: {{n.checksShow}}; align-items: center; gap: 4px; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.02em; line-height: 11px"><span style="width: 10px; height: 10px; box-sizing: border-box; border: 1.5px solid {{t.text}}; display: flex; align-items: center; justify-content: center"><svg width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="3.5"><path d="M5 12l5 5L20 7"></path></svg></span>{{n.checks}}</span></span></div></sc-for></div></div><div style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 72px; display: flex; gap: 8px">
<div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px">
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">ДЕЛА</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">ХОЧУ</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.panel}}; color: {{t.text}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; letter-spacing: 0.08em">СМОТРЕТЬ</button>
<button style="border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em">ЗАМЕТКИ</button>
</div>
<button aria-label="Голосовая команда" style="width: 104px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px"><span style="width: 26px; height: 26px; border-radius: 13px; background: {{t.red}}; box-shadow: 0 0 10px {{t.glow}}"></span><span style="font-family: 'Geist Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: 0.12em; color: {{t.text}}">REC</span></button>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', hairStrong: '#A3A29C', faint: '#A3A29C', text: '#111111', muted: '#5E5E58', red: '#E0281E', warn: '#A15C00', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', hairStrong: '#3A3A3A', faint: '#4A4A47', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', warn: '#E5A50A', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', a: 0.24 },
    ];
    // Октябрь 2026: 1-е — четверг. sel — выбранные дни, from/to — диапазон (для многодневного дела)
    const calendar = (p, o) => Array.from({ length: 35 }, (_, i) => {
      const d = i - 2, inM = d >= 1 && d <= 31;
      const end = inM && (d === o.sel || d === o.from || d === o.to);
      const mid = inM && o.from && d > o.from && d < o.to;
      return {
        n: inM ? d : d < 1 ? 30 + d : d - 31,
        bg: end ? p.text : mid ? rgba(o.tint === 's' ? p.s : p.k, p.a) : 'transparent',
        color: end ? p.bg : !inM ? p.faint : d === 5 ? p.red : p.text,
        weight: end || d === 5 ? 600 : 400,
      };
    });
    const seg = (p, labels, on) => labels.map((label, i) => ({ label, ml: i ? '-1.5px' : '0', bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, weight: i === on ? 600 : 400 }));
    // Цвет человека всегда один: квадрат его цвета. В строке «Кто» показаны только выбранные
    const person = (p, name, c, on) => ({ name, c, show: on ? 'flex' : 'none' });
    const wheel = (p, rows) => rows.map(([h, m], i) => ({ h, m, size: i === 1 ? 17 : 12, weight: i === 1 ? 600 : 400, color: i === 1 ? p.text : p.muted }));
    const notes = [
      ['Алтай', 'Чуйский тракт — 10 дней на машине, в конце июля.', '2/4', '28 СЕН'],
      ['Карелия', 'Сплав по Шуе, 4 дня', '', '15 СЕН'],
      ['Что взять на Байкал', 'Термобельё', '0/6', '2 СЕН'],
    ];
    const themes = pal.map((p) => ({
      ...p,
      glow: rgba(p.red, 0.6),
      notes: notes.map(([title, line, checks, date]) => ({ title, line, lineShow: line ? 'block' : 'none', checks, checksShow: checks ? 'flex' : 'none', date })),
      count: String(notes.length).padStart(2, '0'),
    }));
    return { themes };
  }
}
</script>
</body>
</html>
