<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструмент — вступление: мои дела в группе</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 820px; height: 844px; display: flex; gap: 40px; font-family: 'Geist', sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 20px; background: {{t.bg}}; color: {{t.text}}; outline: 1.5px solid {{t.border}}">
<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 40px; display: flex; align-items: center; gap: 8px"><span style="font-family: 'Geist Mono', monospace; font-size: 10px; letter-spacing: 0.08em; color: {{t.muted}}">ВЫ В ГРУППЕ · ДРУЗЬЯ</span></div><div style="position: absolute; left: 16px; top: 74px; font-size: 40px; font-weight: 700; letter-spacing: -0.05em; line-height: 42px">Мои дела</div><div style="position: absolute; left: 16px; right: 16px; top: 128px; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))"><sc-for list="{{t.mode}}" as="g" hint-placeholder-count="2"><button style="height: 32px; margin-left: {{g.ml}}; border: 1.5px solid {{t.border}}; background: {{g.bg}}; color: {{g.color}}; padding: 0 2px; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: {{g.weight}}; letter-spacing: 0.04em">{{g.label}}</button></sc-for></div><div style="border: 1.5px solid {{t.border}}"><div style="height: 22px; padding: 0 8px; background: {{t.text}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em"><span>ГРУППЕ ВИДНО</span><span>40 / 42</span></div><sc-for list="{{t.mine}}" as="r" hint-placeholder-count="6"><button role="checkbox" aria-checked="{{r.on}}" style="position: relative; width: 100%; height: 44px; border: 0; border-top: 1px solid {{t.hair}}; background: {{t.panel}}; padding: 0 10px 0 12px; display: flex; align-items: center; gap: 10px; font-family: inherit; color: {{t.text}}; text-align: left"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 1.5px; background: {{r.strip}}"></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 13px; font-weight: 500; line-height: 16px; color: {{r.color}}; white-space: nowrap; overflow: hidden">{{r.title}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.02em; line-height: 11px; color: {{t.muted}}">{{r.meta}}</span></span><span style="display: {{r.lockShow}}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2.4"><rect x="5" y="11" width="14" height="10"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span><span style="display: {{r.boxShow}}"><span style="width: 18px; height: 18px; flex-shrink: 0; box-sizing: border-box; border: 1.5px solid {{r.boxBorder}}; background: {{r.box}}; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="{{r.tick}}" stroke-width="3.5"><path d="M5 12l5 5L20 7"></path></svg></span></span></button></sc-for></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: {{t.bg}}; border-top: 1px solid {{t.hair}}"></div><div style="position: absolute; left: 16px; right: 16px; bottom: 16px; height: 44px; display: flex; gap: 8px"><button style="flex: 1; border: 1.5px solid {{t.border}}; background: {{t.text}}; color: {{t.bg}}; font-family: 'Geist Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.1em">ГОТОВО</button></div>

</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', hairStrong: '#A3A29C', faint: '#A3A29C', text: '#111111', muted: '#5E5E58', red: '#E0281E', warn: '#A15C00', s: '#2F6BDB', k: '#E2407E', sInk: '#FFFFFF', kInk: '#1A1A1A', a: 0.2 },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', hairStrong: '#3A3A3A', faint: '#4A4A47', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', warn: '#E5A50A', s: '#5B8DEF', k: '#F06A9B', sInk: '#1A1A1A', kInk: '#1A1A1A', a: 0.24 },
    ];
    // Октябрь 2026: 1-е — четверг. sel — выбранные дни, from/to — диапазон (для многодневного дела)
    const calendar = (p, o) => Array.from({ length: 35 }, (_, i) => {
      const d = i - 2, inM = d >= 1 && d <= 31;
      const end = inM && (d === o.sel || d === o.from || d === o.to);
      const mid = inM && o.from && d > o.from && d < o.to;
      return {
        n: inM ? d : d < 1 ? 30 + d : d - 31,
        bg: end ? p.text : mid ? rgba(o.tint === 's' ? p.s : p.k, p.a) : 'transparent',
        color: end ? p.bg : !inM ? p.faint : d === 5 ? p.red : p.text,
        weight: end || d === 5 ? 600 : 400,
      };
    });
    const seg = (p, labels, on) => labels.map((label, i) => ({ label, ml: i ? '-1.5px' : '0', bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, weight: i === on ? 600 : 400 }));
    // Цвет человека всегда один: квадрат его цвета. В строке «Кто» показаны только выбранные
    const person = (p, name, c, on) => ({ name, c, show: on ? 'flex' : 'none' });
    const wheel = (p, rows) => rows.map(([h, m], i) => ({ h, m, size: i === 1 ? 17 : 12, weight: i === 1 ? 600 : 400, color: i === 1 ? p.text : p.muted }));
    const strip = (p, w) => (w === 'sk' ? 'linear-gradient(' + p.s + ' 50%, ' + p.k + ' 50%)' : w === 's' ? p.s : p.k);
    const box = (p, on, c) => ({ box: on ? (c || p.text) : p.bg, boxBorder: on ? (c || p.text) : p.border, tick: on ? p.bg : 'none' });
    // [название, когда, чей цвет, видно группе, только я]
    const tasks = (p, list) => list.map(([title, meta, w, on, mine]) => ({
      title, meta, strip: strip(p, w), color: mine ? p.muted : p.text,
      on: on ? 'true' : 'false', lockShow: mine ? 'flex' : 'none', boxShow: mine ? 'none' : 'flex', ...box(p, on),
    }));
    const modes = (p, on, counts) => ['Все, кроме скрытых', 'Только выбранные'].map((label, i) => ({
      label, count: counts[i], on: i === on ? 'true' : 'false', top: i ? '1px solid ' + p.hair : '0',
      bg: i === on ? p.text : p.panel, color: i === on ? p.bg : p.text, dot: i === on ? p.bg : 'transparent',
    }));
    const themes = pal.map((p) => ({ ...p, mode: seg(p, ['ВСЕ, КРОМЕ СКРЫТЫХ', 'ТОЛЬКО ВЫБРАННЫЕ'], 0), mine: tasks(p, [
        ['Футбол', 'СР 28 ОКТ · 18:00', 's', true],
        ['Стоматолог', 'ЧТ 29 ОКТ · 09:30', 's', true],
        ['Подарок Карине', 'СБ 31 ОКТ', 's', false],
        ['Поезд в Казань', 'ПН 2 НОЯ · 07:00', 's', true],
        ['Психолог', 'ВТ 3 НОЯ · 19:00', 's', false, true],
        ['Оплатить коммуналку', 'ПТ 6 НОЯ', 's', true],
      ]) }));
    return { themes };
  }
}
</script>
</body>
</html>
