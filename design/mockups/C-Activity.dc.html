<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Инструмент — лента</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 820px; height: 844px; display: flex; gap: 40px; font-family: 'Geist', sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 20px; background: {{t.bg}}; color: {{t.text}}; outline: 1.5px solid {{t.border}}">

<div style="position: absolute; left: 16px; right: 16px; top: 20px; height: 40px; display: flex; align-items: center; gap: 10px">
<button aria-label="Назад" style="width: 40px; height: 40px; border: 1.5px solid {{t.border}}; background: {{t.panel}}; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.text}}" stroke-width="2"><path d="m15 18-6-6 6-6"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-family: 'Geist Mono', monospace; font-size: 9px; letter-spacing: 0.08em; line-height: 11px; color: {{t.muted}}; white-space: nowrap; overflow: hidden">ВСЕ ГРУППЫ · 30 ДНЕЙ</span><span style="font-size: 22px; font-weight: 700; letter-spacing: -0.04em; line-height: 24px; white-space: nowrap; overflow: hidden">Лента</span></div><span style="display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-family: 'Geist Mono', monospace; font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em"><span style="width: 7px; height: 7px; border-radius: 4px; background: {{t.red}}; box-shadow: 0 0 6px {{t.glow}}"></span>3 НОВЫХ</span>
</div>

<div style="position: absolute; left: 16px; right: 16px; top: 72px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{t.days}}" as="d" hint-placeholder-count="3">
<div style="border: 1.5px solid {{t.border}}">
<div style="height: 22px; padding: 0 8px; background: {{t.text}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: space-between; font-family: 'Geist Mono', monospace; font-size: 9px; font-weight: 600; letter-spacing: 0.08em"><span>{{d.label}}</span><span>{{d.date}}</span></div>
<sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
<div style="display: flex; gap: 8px; padding: 8px; background: {{t.panel}}; border-top: 1px solid {{t.hair}}">
<span style="width: 24px; height: 24px; flex-shrink: 0; background: {{r.color}}; color: {{r.ink}}; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{r.letter}}</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12.5px; line-height: 16px"><b style="font-weight: 600">{{r.who}}</b> {{r.text}}</span>
<span style="font-family: 'Geist Mono', monospace; font-size: 9px; line-height: 11px; letter-spacing: 0.04em; color: {{t.muted}}">{{r.time}} · {{r.group}}</span>
</div>
<sc-if value="{{r.fresh}}" hint-placeholder-val="{{false}}"><span style="width: 7px; height: 7px; margin-top: 4px; border-radius: 4px; background: {{t.red}}; box-shadow: 0 0 6px {{t.glow}}; flex-shrink: 0"></span></sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    const pal = [
      { bg: '#E7E6E1', panel: '#F4F3EF', border: '#161616', hair: '#CFCEC8', text: '#111111', muted: '#5E5E58', red: '#E0281E', k: '#E2407E', g: '#1F9D57', y: '#E0A800', kInk: '#1A1A1A', gInk: '#FFFFFF', yInk: '#1A1A1A' },
      { bg: '#0B0B0B', panel: '#151515', border: '#2E2E2E', hair: '#222222', text: '#F2F2F0', muted: '#7C7C78', red: '#FF3B30', k: '#F06A9B', g: '#3DBE76', y: '#F2C230', kInk: '#1A1A1A', gInk: '#1A1A1A', yInk: '#1A1A1A' },
    ];
    const themes = pal.map((p) => {
      const P = { k: [p.k, p.kInk, 'К', 'Карина'], g: [p.g, p.gInk, 'Д', 'Дима'], y: [p.y, p.yInk, 'Л', 'Лена'] };
      const row = (w, text, time, group, fresh) => ({ color: P[w][0], ink: P[w][1], letter: P[w][2], who: P[w][3], text, time, group, fresh: !!fresh });
      return {
        ...p,
        glow: rgba(p.red, 0.6),
        days: [
          { label: 'СЕГОДНЯ', date: 'ПН 05', rows: [
            row('k', 'добавила дело «Баня» на сб 10 окт · 15:00', '17:40', 'МЫ С КАРИНОЙ', true),
            row('k', 'отметила «Забрать посылку»', '14:12', 'МЫ С КАРИНОЙ', true),
            row('g', 'добавил «Шашлыки на даче» на сб 17 окт', '11:05', 'ДРУЗЬЯ', true),
          ] },
          { label: 'ВЧЕРА', date: 'ВС 04', rows: [
            row('k', 'перенесла «Йога» на пн 5 окт · 19:00', '21:30', 'МЫ С КАРИНОЙ'),
            row('y', 'открыла тему «Подарки на НГ» группе', '18:02', 'ДРУЗЬЯ'),
            row('k', 'добавила в «Смотреть» сериал «Разделение»', '12:47', 'МЫ С КАРИНОЙ'),
            row('g', 'добавил в «Хочу» ручную кофемолку', '10:20', 'ДРУЗЬЯ'),
          ] },
          { label: 'СУББОТА', date: 'СБ 03', rows: [
            row('y', 'отметила «Забронировать столик»', '20:15', 'ДРУЗЬЯ'),
            row('k', 'добавила дело «Стоматолог» на пн 5 окт · 09:30', '16:48', 'МЫ С КАРИНОЙ'),
            row('g', 'создал группу «Друзья» и пригласил Лену', '11:32', 'ДРУЗЬЯ'),
          ] },
        ],
      };
    });
    return { themes };
  }
}
</script>
</body>
</html>
